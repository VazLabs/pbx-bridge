[package]
name = "telegram"
version = "0.1.0"
edition.workspace = true

[dependencies]
config = { path = "../config"}
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"]}
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"]}
tgcalls = { git = "https://github.com/Atixx/tgcalls", branch = "update-P2PCall"}
ferogram  = { version = "0.6.5", features = ["sqlite-session"] }
rusqlite = "0.40"
libc = "0.2"
ntgcalls = { version = "3.0.0" }
