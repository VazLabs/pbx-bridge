[workspace]

members = [
  "bin/bridge",
  "crates/asterisk",
  "crates/config",
  "crates/router",
  "crates/telegram",
]

resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
tokio = {version = "1", features = ["full"]}
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3" }
serde = { version = "1", features = ["derive"]}
toml = "0.8"
